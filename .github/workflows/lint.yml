name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Chạy gitleaks CLI qua Docker image chính thức, quét toàn bộ lịch sử git.
      # Không dùng gitleaks-action vì action này từng lỗi (exit code 1) ở lần push
      # đầu tiên: nó quét khoảng "<root>^..HEAD" mà root commit không có commit cha.
      - name: Scan for secrets (full history)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0="*" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --no-banner
