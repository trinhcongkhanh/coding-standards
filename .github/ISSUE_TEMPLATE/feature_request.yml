name: 💡 Đề xuất nội dung mới
description: Gợi ý thêm mục checklist, template hoặc ngôn ngữ mới
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
      description: Bạn muốn thêm gì?
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Quy mô áp dụng
      options:
        - 🟢 S - Small
        - 🟡 M - Medium
        - 🔴 L - Large
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Lý do
      description: Tại sao mục này hữu ích? Có nguồn tham khảo không?
